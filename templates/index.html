
<h3>Light Controls</h3>
{% for led in leds %}
    <h4>LED {{ led.name }}</h4>

    <form method="POST" action="/">
        <input type="hidden" name="led_id" value="{{ led.id }}">
        <input type="submit" value="ON" name="action">
        <input type="submit" value="OFF" name="action">
        <input type="submit" value="FLASH" name="action">

        <br><br>

        <input type="range"
               name="brightness"
               min="0"
               max="100"
               value="{{ led.brightness }}"
               oninput="this.nextElementSibling.value=this.value">

        <output>{{ led.brightness }}</output>

        <button type="submit" name="action" value="brightness">
            Set brightness
        </button>
    </form>

    <hr>
{% endfor %}

<h3>Distance Sensor</h3>
<p>Distance: <strong id="distance">--</strong></p>
<p id="distance-error" style="color: #b00;"></p>

<script>
    const distanceEl = document.getElementById("distance");
    const errorEl = document.getElementById("distance-error");

    async function updateDistance() {
        try {
            const response = await fetch("/sensor");
            const data = await response.json();
            if (data.ok) {
                distanceEl.textContent = data.distance_mm + " mm";
                errorEl.textContent = "";
            } else {
                distanceEl.textContent = "--";
                errorEl.textContent = data.error || "Reading failed";
            }
        } catch (e) {
            distanceEl.textContent = "--";
            errorEl.textContent = "Cannot reach server";
        }
        // Schedule the next poll only after this one finishes, so slow reads don't pile up
        setTimeout(updateDistance, 1000);
    }

    updateDistance();
</script>
